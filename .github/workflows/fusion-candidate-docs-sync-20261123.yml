name: Refresh fusion candidate embedded Wiki settings
on:
  push:
    branches: [review/fusion-resolved-candidate-20261123]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: review-fusion-embedded-docs
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate embedded settings with preserved Wiki manual regions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          bundle=Path('openpilot/selfdrive/carrot/web/docs/settings')
          index=json.loads((bundle/'Settings-Catalog.json').read_text(encoding='utf-8'))
          args=['python','tools/docs/wiki_settings/generate.py','--wiki-dir',str(bundle),
                '--write','--output-dir',str(bundle),'--locales',*index['locales'],
                '--catalog-commit',index['catalogCommit'],'--generated-at',index['generatedAt']]
          if index.get('wikiCommit'):
            args += ['--wiki-commit',index['wikiCommit']]
          subprocess.run(args,check=True)
          PY
          python -m unittest discover -s tools/docs/wiki_settings/tests -p 'test_*.py' -q
      - name: Commit only generated documentation to isolated review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fusion documentation"
          git config user.email "fusion-docs@users.noreply.github.com"
          git add -- openpilot/selfdrive/carrot/web/docs/settings
          if git diff --cached --quiet; then
            echo "Embedded settings documentation is up to date."
          else
            git commit -m "docs: refresh embedded settings against merged catalog"
            git push origin HEAD:refs/heads/review/fusion-resolved-candidate-20261123
          fi
