name: Gaode C4 offline vision observation checks
on:
  push:
    branches:
      - test/carrot-wip-upstream-20261104
      - test/tony-carrot-wip-integrated-20261117
    paths:
      - 'tools/carrot_navi_lab/gaode_vision_export.py'
      - 'tools/carrot_navi_lab/test_gaode_vision_export.py'
      - 'tools/carrot_navi_lab/gaode_lane_shadow.py'
      - '.github/workflows/gaode-vision-observation.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/carrot_navi_lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run offline synthetic regression
        run: |
          cd tools/carrot_navi_lab
          python -m py_compile gaode_vision_export.py
          python -m unittest -v test_gaode_lane_shadow test_gaode_vision_export
