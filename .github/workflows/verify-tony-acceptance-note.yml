    branches: ['review/tony-android-note-20261118']
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch --no-tags https://github.com/TonyBinheWu/sunnypilot.git 715f3f53d6ceabdf42794275d4002e97fc4fb1ba
          git bundle verify reviewed.bundle
          git fetch reviewed.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "fd6ca6c5c9f486a81b6aed421f2c25671ddc8047"
          test "$(git rev-parse FETCH_HEAD^1)" = "5f1d3858b2e8db86f3b767377ac390134cfdc2a4"
          test "$(git rev-parse FETCH_HEAD^2)" = "715f3f53d6ceabdf42794275d4002e97fc4fb1ba"
