name: Validate acceptance-note candidate
on:
  push:
    branches: ['review/tony-android-note-20261118']
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch --no-tags https://github.com/TonyBinheWu/sunnypilot.git d2b71a759f0fcb37368efba2db7c772150d67891
          git bundle verify reviewed.bundle
          git fetch reviewed.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "5f1d3858b2e8db86f3b767377ac390134cfdc2a4"
          test "$(git rev-parse FETCH_HEAD^1)" = "7d7279e2ec0063f3b906607c4fea7f692fb14ec5"
          test "$(git rev-parse FETCH_HEAD^2)" = "d2b71a759f0fcb37368efba2db7c772150d67891"
          git push origin 5f1d3858b2e8db86f3b767377ac390134cfdc2a4:refs/heads/review/tony-android-note-candidate-20261118
