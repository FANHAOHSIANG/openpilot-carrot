name: Curve centering observer
on:
  pull_request:
    paths:
      - "openpilot/tools/curve_centering/**"
      - ".github/workflows/curve-centering-observer.yml"
  push:
    branches: ["research/curve-centering-observer-*"]
    paths:
      - "openpilot/tools/curve_centering/**"
      - ".github/workflows/curve-centering-observer.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            openpilot/tools/curve_centering
            openpilot/cereal
            opendbc_repo/opendbc/car
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pycapnp==2.1.0 zstandard pytest
      - run: python -m pytest -o addopts='' --confcutdir=openpilot/tools/curve_centering openpilot/tools/curve_centering/tests -q
