name: Android LED UI preview
on:
  push:
    branches: [carrot-wip]
    paths: ['tools/iphone_led/android/app/src/**', '.github/workflows/android-led-ui.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: tools/iphone_led/android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash tools/iphone_led/android/build-apk.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p /tmp/carrot-led-ui
            adb install tools/iphone_led/android/build-cli/CarrotLED-0.1.7.apk
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell am start -n tw.carrot.led/.MainActivity
            sleep 3
            adb exec-out screencap -p > /tmp/carrot-led-ui/android-phone.png
            adb shell wm size 1920x720
            adb shell wm density 200
            adb shell am force-stop tw.carrot.led
            adb shell am start -n tw.carrot.led/.MainActivity
            sleep 3
            adb exec-out screencap -p > /tmp/carrot-led-ui/android-car.png
            adb shell input tap 1688 80
            sleep 2
            adb exec-out screencap -p > /tmp/carrot-led-ui/android-eyes.png
            adb logcat -d -s AndroidRuntime:E > /tmp/carrot-led-ui/crash-log.txt
            if grep -q 'FATAL EXCEPTION' /tmp/carrot-led-ui/crash-log.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-preview
          path: /tmp/carrot-led-ui/
