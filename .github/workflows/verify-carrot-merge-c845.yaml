name: Temporary merged Test regression c845
on:
  push:
    branches:
      - verify/carrot-wip-c845-merged-20261109

permissions:
  contents: read

jobs:
  controlsd_merged_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Confirm merged controlsd safety guards and Python compilation
        run: |
          python3 -m compileall -q openpilot/selfdrive/controls/controlsd.py openpilot/selfdrive/controls/tests/test_publish_plan_age.py openpilot/selfdrive/carrot/bluetooth/daemon.py openpilot/tools/__init__.py openpilot/system/memory_trace.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p = Path('openpilot/selfdrive/controls/controlsd.py')
          tree = ast.parse(p.read_text())
          cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'Controls')
          pub = next(n for n in cls.body if isinstance(n, ast.FunctionDef) and n.name == 'publish')
          src = ast.get_source_segment(p.read_text(), pub)
          assert "0 <= (self.sm.frame - self.sm.recv_frame['longitudinalPlan']) * DT_CTRL <= 0.2" in src
          assert "0 <= (self.sm.frame - self.sm.recv_frame['radarState']) * DT_CTRL <= 0.2" in src
          assert "self.sm.all_checks(['longitudinalPlan', 'radarState'])" in src
          print('publish fresh/valid 0–0.2 s gating retained')
          PY
      - name: Execute actual production publish AST mock regressions
        run: python3 -m unittest discover -s openpilot/selfdrive/controls/tests -p test_publish_plan_age.py -v

  official_diagnostics_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: GC and memory sampler regressions
        run: python -m pytest -c /dev/null --rootdir=. --noconftest -q openpilot/system/tests/test_memory_trace.py
