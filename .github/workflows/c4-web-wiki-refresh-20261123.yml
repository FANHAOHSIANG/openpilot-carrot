name: C4 Web settings wiki refresh (review branch only)
on:
  push:
    branches: ['sync/tony-integrated-c4-web-style-20261123']
    paths:
      - '.github/workflows/c4-web-wiki-refresh-20261123.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh embedded wiki pages deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.docs.wiki_settings import generate as g
          path=Path("openpilot/selfdrive/carrot/web/docs/settings")
          index=json.loads((path/"Settings-Catalog.json").read_text(encoding="utf-8"))
          result=g.generate(g.DEFAULT_CATALOG, wiki_dir=path, locales=index["locales"],
                            catalog_commit=index["catalogCommit"], wiki_commit=index["wikiCommit"],
                            generated_at=index["generatedAt"])
          g.write_result(result,path)
          print("Generated pages:",len(result.pages),"changes:",result.page_changes)
          PY
          git add -A -- openpilot/selfdrive/carrot/web/docs/settings
          changed=$(git diff --cached --name-only | wc -l)
          echo "Changed generated files: $changed"
          git diff --cached --stat
          if [ "$changed" -gt 12 ]; then
            echo "Unexpectedly broad wiki refresh: refusing to push" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Nothing to update"; exit 0
          fi
          git config user.name "Carrot Wiki review CI"
          git config user.email "carrot-wiki-review@users.noreply.github.com"
          git commit -m "docs(wiki): refresh C4 display settings catalogue pages [skip ci]"
          git push origin HEAD:sync/tony-integrated-c4-web-style-20261123
