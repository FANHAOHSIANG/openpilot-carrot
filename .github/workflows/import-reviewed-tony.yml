name: Import reviewed Tony source
on:
  push:
    branches: ['sync/import-tony-d2b5b1be-20261117']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Import exact reviewed upstream commit into isolated source ref
        run: |
          git fetch --no-tags https://github.com/TonyBinheWu/sunnypilot.git d2b5b1be1cc5ea6b4497a7dc4f0a997b4640108c
          test "$(git rev-parse FETCH_HEAD)" = d2b5b1be1cc5ea6b4497a7dc4f0a997b4640108c
          git push origin d2b5b1be1cc5ea6b4497a7dc4f0a997b4640108c:refs/heads/sync/tony-source-d2b5b1be
