name: Verify offline teacher follow-up
on:
  push:
    branches: ['review/tony-afternoon-import-20261118']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch --no-tags https://github.com/TonyBinheWu/sunnypilot.git 9cea50138ee1b4a6a8f989f435bc1cb9248d47fd
          git bundle verify candidates.bundle
          git fetch candidates.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "1b51e15a9414d9a090b494e19bcd1d32a59aac04"
          test "$(git rev-parse FETCH_HEAD^1)" = "a2c41011d16cd0c3088b4c542f7663f354934fef"
          git push origin 1b51e15a9414d9a090b494e19bcd1d32a59aac04:refs/heads/review/tony-coordinate-teacher-20261118
