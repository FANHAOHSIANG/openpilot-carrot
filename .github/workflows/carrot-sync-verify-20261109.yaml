name: Carrot official merge candidate validation 0df83618
on:
  push:
    branches:
      - sync/verify-official-0df83618-test-20261109
permissions:
  contents: read
jobs:
  manual-indicator-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: .:opendbc_repo:tools/jetlink
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install Cython==3.2.9 setuptools scons pytest pytest-subtests numpy pycapnp cffi setproctitle requests pycryptodome zstandard pyserial parameterized
      - name: Build native CPU and safety library
        run: |
          scons -f tools/native_cpu/SConstruct -j2
          python opendbc_repo/opendbc/dbc/generator/generator.py
          cd opendbc_repo/opendbc/safety
          gcc -shared -fPIC -Wall -Werror -nostdlib -fno-builtin -std=gnu11 -Wfatal-errors -Wno-pointer-to-int-cast -I. -Iboard tests/libsafety/safety.c -o tests/libsafety/libsafety.so
      - name: Manual indicator and surrounding policy tests
        run: |
          python tools/signal_validation/run.py             tools/jetlink/test_blinker_boundary.py             tools/jetlink/test_manual_turn_indicator.py             tools/jetlink/test_blinker.py             tools/jetlink/test_blinker_auto.py             opendbc_repo/opendbc/car/hyundai/tests/test_spas.py             opendbc_repo/opendbc/safety/tests/test_hyundai_spas.py             openpilot/selfdrive/car/tests/test_hyundai_spas.py             openpilot/selfdrive/controls/tests/test_desire_helper_stalk.py             openpilot/selfdrive/controls/tests/test_lever_forced_turn.py
