name: Carrot Test Jetson Super official sync gate
on:
  push:
    branches:
      - sync/carrot-wip-official-162da468-to-test-20261112
      - test/carrot-wip-upstream-20261104
  pull_request:
    branches:
      - test/carrot-wip-upstream-20261104
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-preservation:
    name: Pinned official and existing custom Git content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify both merge parents and unchanged custom content
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 98331d2321fa063174a82cb7d17d2c5c8a35a004 HEAD
          git merge-base --is-ancestor 162da468cc4157f9b18daa4f6ac85438f51719ef HEAD
          check() {
            actual="$(git rev-parse "HEAD:$1")"
            test "$actual" = "$2" || { echo "Custom content changed: $1 ($actual)"; exit 1; }
          }
          check tools/iphone_led 11232ceba02150870db08c49889cdf6e68d6d11d
          check openpilot/selfdrive/carrot/iphone_led_bridge.py 425b919eac4fc35440691aff477249c79e0a1313
          check openpilot/system/manager/process_config.py 58b701c40d1412d63c12fd06ec9de2074108b4c0
          check openpilot/cereal/custom.capnp 815aed779c8a95a89b957b874f994731031e4775
          check openpilot/tools/clearance_shadow d51e5076b4a87eb8a2213cc0e0f1255a26bec9ed
          check openpilot/selfdrive/carrot/server/features/google_share.py 6cc78d6ddbe9a2bba077f56008b332107e0b3965
          check openpilot/selfdrive/modeld/jetlink/model.py bad7dd756aac4f5871d9df5dc68e18ca1119485f
          check third_party/jetlink 34dde67d4e4ffeb95c3001198e8fc405dd3ff75e
          echo "Pinned official ancestry and existing Test custom blob checks passed"

  jetlink-super-offline:
    name: N16 Super, signed update, SD and prepare-only offline regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .:opendbc_repo:tools/jetlink:third_party/jetlink
      CARROT_STORAGE_MOUNTS: '0'
      CARROT_WIFI_NAT_NAMESPACE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test-only dependencies
        run: python -m pip install pytest==8.3.5 pytest-asyncio numpy pycapnp zstandard pycryptodome requests pyserial aiohttp pillow
      - name: Check Python syntax without running installers or firmware tools
        run: python -m compileall -q tools/jetlink openpilot/selfdrive/modeld/jetlink
      - name: Test mock firmware/bootstrap, power, SD-image and host update behavior
        run: |
          python -m pytest -c /dev/null --rootdir=. --confcutdir=tools/jetlink -q \
            tools/jetlink/test_power_setup.py \
            tools/jetlink/test_super_bootstrap.py \
            tools/jetlink/test_host_performance.py \
            tools/jetlink/test_protected_storage.py \
            tools/jetlink/test_refresh_sd_image.py \
            tools/jetlink/test_windows_installer.py \
            tools/jetlink/test_update_host.py \
            tools/jetlink/test_boot_update.py
      - name: Test preserved Test-specific Jetlink prepare-only contract
        run: |
          python -m pytest -c /dev/null --rootdir=. --noconftest -q \
            openpilot/selfdrive/modeld/tests/test_jetlink_prepare_only_regression.py

  windows-installer:
    name: Windows installer and safe disk-selection offline checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python Windows-image fixture tests
        run: python -m pip install pytest==8.3.5
      - name: Check image preparation and integrity in a temporary fixture
        run: python -m pytest -c NUL --noconftest -q tools/jetlink/test_windows_installer.py
      - name: Check installer disk selection without opening a real disk
        shell: pwsh
        run: ./tools/jetlink/windows_installer/test_disks.ps1
