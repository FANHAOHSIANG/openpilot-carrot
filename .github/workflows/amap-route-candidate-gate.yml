name: Amap complete route candidate offline validation
on:
  push:
    branches:
      - validation/amap-route-a67b2a42-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-contract:
    name: Full-route bounds, parsing, and existing navigation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:opendbc_repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Python test dependencies
        run: python -m pip install pytest==8.3.5 pytest-asyncio aiohttp numpy pycapnp zstandard requests pyzmq
      - name: Compile affected source and tests without running any vehicle software
        run: python -m compileall -q openpilot/selfdrive/carrot/carrot_navi_cereal.py openpilot/selfdrive/carrot/carrot_navi_control.py openpilot/selfdrive/carrot/tests/test_carrot_navi_route_bounds.py
      - name: Test full route preservation and refusal of bad geometry
        run: |
          python -m pytest -c /dev/null --noconftest -o addopts='' -q             openpilot/selfdrive/carrot/tests/test_carrot_navi_route_bounds.py             openpilot/selfdrive/carrot/tests/test_carrot_navi_control.py             openpilot/selfdrive/carrot/tests/test_carrot_navi.py
  nav-integration:
    name: Existing navigation and speed-control regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .:opendbc_repo:tools/jetlink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test and native CAN dependencies
        run: python -m pip install Cython==3.2.9 setuptools scons pytest==8.3.5 pytest-asyncio pytest-subtests numpy pycapnp cffi setproctitle requests pycryptodome zstandard pyserial parameterized aiohttp pillow pyzmq psutil
      - name: Install msgq build-only C++ support
        run: python -m pip install 'catch2 @ git+https://github.com/commaai/dependencies.git@release-catch2#subdirectory=catch2'
      - name: Compile local native CAN and msgq IPC test dependencies without hardware
        run: |
          (cd msgq_repo && scons --minimal -j2)
          scons -f tools/native_cpu/SConstruct -j2
          python opendbc_repo/opendbc/dbc/generator/generator.py
      - name: Verify navigation priority, speed control, and route matching regressions
        run: |
          python -m pytest -c /dev/null --noconftest -o addopts='' -q             openpilot/selfdrive/carrot/tests/test_external_navigation_priority.py             openpilot/selfdrive/carrot/tests/test_vehicle_speed_camera_control.py             openpilot/selfdrive/carrot/tests/test_carrot_navi_serv.py             openpilot/selfdrive/carrot/tests/test_carrot_navi_route_bridge.py             openpilot/selfdrive/navigation/tests/test_route_engine.py             openpilot/selfdrive/navigation/tests/test_route_position.py
