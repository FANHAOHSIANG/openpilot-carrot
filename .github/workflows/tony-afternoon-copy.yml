          set -euo pipefail
          git fetch --no-tags https://github.com/TonyBinheWu/sunnypilot.git dd24c1c200d7d012dbfa4225b7708396d6c0dc2f
          test "$(git rev-parse FETCH_HEAD)" = dd24c1c200d7d012dbfa4225b7708396d6c0dc2f
          git merge-base --is-ancestor 25fe1853bb030b5237335c5e91b54ad99003131c dd24c1c200d7d012dbfa4225b7708396d6c0dc2f
