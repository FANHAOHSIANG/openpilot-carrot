          set -euo pipefail
          git fetch --no-tags https://github.com/TonyBinheWu/sunnypilot.git d4ccaab71a886fb6f816948a19e8d82e00614818
          test "$(git rev-parse FETCH_HEAD)" = d4ccaab71a886fb6f816948a19e8d82e00614818
          git merge-base --is-ancestor 689a7a33422c234c3e5169ecc9df53d289df02a7 d4ccaab71a886fb6f816948a19e8d82e00614818
