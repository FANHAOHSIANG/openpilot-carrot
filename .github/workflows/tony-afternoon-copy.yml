    branches: ['review/tony-afternoon-copy-20261119']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/TonyBinheWu/sunnypilot.git 436d63c524ae61b7768a86a4ec2e6dbeb846abd4
          test "$(git rev-parse FETCH_HEAD)" = 436d63c524ae61b7768a86a4ec2e6dbeb846abd4
          git merge-base --is-ancestor 0555514ed8972960d6ae6c4ab7a2991b328331f9 436d63c524ae61b7768a86a4ec2e6dbeb846abd4
