name: Tony Test integration (offline)
on:
  push:
    branches: ['test/tony-carrot-wip-integrated-20261117', 'sync/tony-integrated-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-offline-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .:opendbc_repo:tools/jetlink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline dependencies
        run: python -m pip install Cython==3.2.9 setuptools scons pytest pytest-mock pytest-subtests numpy pycapnp cffi setproctitle requests pycryptodome zstandard pyserial parameterized aiohttp jeepney tqdm hypothesis
      - name: Build CPU test libraries
        run: |
          scons -Q -f tools/native_cpu/SConstruct -j2
          python opendbc_repo/opendbc/dbc/generator/generator.py
          gcc -shared -fPIC -Wall -Werror -nostdlib -fno-builtin -std=gnu11 -Wfatal-errors -Wno-pointer-to-int-cast -Iopendbc_repo/opendbc/safety -Iopendbc_repo/opendbc/safety/board opendbc_repo/opendbc/safety/tests/libsafety/safety.c -o opendbc_repo/opendbc/safety/tests/libsafety/libsafety.so
      - run: npm ci --prefix openpilot/selfdrive/carrot/web
      - name: Focused regressions (not a full safety or vehicle qualification)
        run: bash tools/integration_checks/tony_test_20261117.sh
      - name: Check reproducible web assets
        run: git diff --exit-code -- openpilot/selfdrive/carrot/web/css/generated openpilot/selfdrive/carrot/web/js/generated openpilot/selfdrive/carrot/web/generated
