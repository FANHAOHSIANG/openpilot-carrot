name: Tony Test integration (offline)
on:
  push:
    branches: ['test/tony-carrot-wip-integrated-20261117', 'sync/tony-integrated-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-offline-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .:opendbc_repo:tools/jetlink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline dependencies
        run: python -m pip install Cython==3.2.9 setuptools scons pytest pytest-mock pytest-subtests pytest-asyncio numpy pycapnp cffi setproctitle requests pycryptodome zstandard pyserial pyzmq casadi parameterized aiohttp jeepney tqdm hypothesis -r formosalink/requirements.txt
      - name: Install CPU teacher-training test dependencies
        run: |
          python -m pip install safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build CPU test libraries
        run: |
          scons -Q -f tools/native_cpu/SConstruct -j2
          python opendbc_repo/opendbc/dbc/generator/generator.py
          gcc -shared -fPIC -Wall -Werror -nostdlib -fno-builtin -std=gnu11 -Wfatal-errors -Wno-pointer-to-int-cast -Iopendbc_repo/opendbc/safety -Iopendbc_repo/opendbc/safety/board opendbc_repo/opendbc/safety/tests/libsafety/safety.c -o opendbc_repo/opendbc/safety/tests/libsafety/libsafety.so
      - run: npm ci --prefix openpilot/selfdrive/carrot/web
      - name: Focused regressions (not a full safety or vehicle qualification)
        run: bash tools/integration_checks/tony_test_20261117.sh
      - name: Check reproducible web assets
        run: git diff --exit-code -- openpilot/selfdrive/carrot/web/css/generated openpilot/selfdrive/carrot/web/js/generated openpilot/selfdrive/carrot/web/generated

  firmware:
    name: Panda F4 and H7 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ARM compiler
        run: |
          # Fetch the toolchain through Ubuntu's signed HTTPS archive. Regional
          # runner mirrors have stalled while downloading the large newlib package.
          sources="$RUNNER_TEMP/panda-toolchain.list"
          echo 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' > "$sources"
          echo 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' >> "$sources"
          echo 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' >> "$sources"
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
          sudo apt-get "${apt_options[@]}" update -qq
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
          pip install scons pycryptodome
      - name: Compile production firmware
        working-directory: panda
        run: scons --minimal -j2

  c4-native-wheel-smoke:
    name: C4 vendor wheel ABI (native ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bundled C4 native dependencies on ARM64
        shell: bash
        run: |
          python -m pip install numpy
          python -m pip install --no-index --no-deps --find-links third_party/wheels \
            'comma-deps-acados==0.2.2.post103' eigen libjpeg \
            'comma-deps-json11==20170411.0.post103' 'comma-deps-catch2==2.13.10.post96'
      - name: Verify native module ABIs, asset paths, and solver import
        shell: bash
        run: |
          set -euo pipefail
          for package in acados eigen libjpeg json11 catch2; do
            PYTHONPATH="$GITHUB_WORKSPACE" python -m openpilot.system.manager.native_dependency_audit --check "$package"
            echo "ARM64 $package valid"
          done
      - name: Prove pinned cffi Python and native backend load together from pydeps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c4-pydeps"
          python -m pip install --no-index --no-deps --find-links third_party/wheels \
            --target "$RUNNER_TEMP/c4-pydeps" 'pycparser==3.0' 'cffi==2.0.0'
          PYTHONPATH="$RUNNER_TEMP/c4-pydeps:$GITHUB_WORKSPACE" \
            python -m openpilot.system.manager.native_dependency_audit --check cffi
          PYTHONPATH="$RUNNER_TEMP/c4-pydeps:$GITHUB_WORKSPACE" python - <<'PY'
          import cffi, _cffi_backend
          assert cffi.__version__ == _cffi_backend.__version__ == "2.0.0"
          assert "/c4-pydeps/" in cffi.__file__
          assert "/c4-pydeps/" in _cffi_backend.__file__
          cffi.FFI()
          print("ARM64 cffi Python/backend both loaded from pydeps and FFI instantiated")
          PY
      - name: Validate bundled aiohttp and pyserial service APIs in ARM64 pydeps overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c4-service-pydeps"
          python -m pip install --no-index --find-links third_party/wheels \
            --target "$RUNNER_TEMP/c4-service-pydeps" 'aiohttp==3.13.3' 'pyserial==3.5'
          PYTHONPATH="$RUNNER_TEMP/c4-service-pydeps:$GITHUB_WORKSPACE" \
            python -m openpilot.system.manager.runtime_service_audit
          PYTHONPATH="$RUNNER_TEMP/c4-service-pydeps:$GITHUB_WORKSPACE" python - <<'PY'
          import aiohttp, serial
          from aiohttp import WSMsgType, web
          assert "/c4-service-pydeps/" in aiohttp.__file__, aiohttp.__file__
          assert "/c4-service-pydeps/" in serial.__file__, serial.__file__
          assert hasattr(web, "Application") and hasattr(web, "WebSocketResponse")
          assert WSMsgType.TEXT is not None
          assert callable(serial.Serial) and callable(serial.VTIMESerial)
          print("ARM64 Carrot service dependencies verified")
          PY
