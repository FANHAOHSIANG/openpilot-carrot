name: Carrot Test CAN FD official sync gate
on:
  push:
    branches:
      - sync/carrot-wip-official-ecdd0439-to-test-20261111
      - test/carrot-wip-upstream-20261104
    paths:
      - opendbc_repo/opendbc/car/hyundai/**
      - openpilot/selfdrive/controls/**
      - openpilot/selfdrive/selfdrived/**
      - .github/workflows/carrot-test-canfd-official-gate.yaml
  pull_request:
    branches:
      - test/carrot-wip-upstream-20261104
    paths:
      - opendbc_repo/opendbc/car/hyundai/**
      - openpilot/selfdrive/controls/**
      - openpilot/selfdrive/selfdrived/**
      - .github/workflows/carrot-test-canfd-official-gate.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-preservation:
    name: Pinned official and custom-bridge source tree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure exact official change and unchanged Test custom blobs
        shell: bash
        run: |
          set -euo pipefail
          check() { test "$(git rev-parse "HEAD:$1")" = "$2" || { echo "Mismatch: $1"; exit 1; }; }
          check opendbc_repo/opendbc/car/hyundai/hyundaicanfd.py 2f38d85603a43a2af883e734742e9c8303e726dc
          check opendbc_repo/opendbc/car/hyundai/tests/test_stopping.py 56b8e39297bca0aba2613dc8ad204fd65b928a0a
          check tools/iphone_led 11232ceba02150870db08c49889cdf6e68d6d11d
          check openpilot/selfdrive/carrot/iphone_led_bridge.py 425b919eac4fc35440691aff477249c79e0a1313
          check openpilot/system/manager/process_config.py 58b701c40d1412d63c12fd06ec9de2074108b4c0
          check openpilot/cereal/custom.capnp 815aed779c8a95a89b957b874f994731031e4775
          check openpilot/tools/clearance_shadow d51e5076b4a87eb8a2213cc0e0f1255a26bec9ed
  canfd-safety:
    name: Native CAN FD/Panda safety and stop-state regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .:opendbc_repo:tools/jetlink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing offline validation dependencies
        run: python -m pip install Cython==3.2.9 setuptools scons pytest pytest-subtests numpy pycapnp cffi setproctitle requests pycryptodome zstandard pyserial parameterized
      - name: Build native CAN and Panda safety test hooks (no vehicle I/O)
        shell: bash
        run: |
          scons -f tools/native_cpu/SConstruct -j2
          python opendbc_repo/opendbc/dbc/generator/generator.py
          cd opendbc_repo/opendbc/safety
          gcc -shared -fPIC -Wall -Werror -nostdlib -fno-builtin -std=gnu11 -Wfatal-errors -Wno-pointer-to-int-cast -I. -Iboard tests/libsafety/safety.c -o tests/libsafety/libsafety.so
      - name: Run focused Hyundai stopping, SCC, CAN FD safety and controls tests
        run: |
          python tools/signal_validation/run.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_stopping.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_stop_object.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_casper_fault_reporting.py \
            opendbc_repo/opendbc/safety/tests/test_hyundai_canfd_alt_buttons.py \
            openpilot/selfdrive/controls/tests/test_controlsd_publish.py \
            openpilot/selfdrive/selfdrived/tests/test_vehicle_faults.py
