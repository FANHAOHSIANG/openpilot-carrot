name: Verify reviewed Formosa mobile integration
on:
  push:
    branches: ['review/formosa-phone-check-20261118']
permissions:
  contents: read
jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed commit and preserve isolated candidate
        run: |
          git fetch --no-tags https://github.com/ajouatom/openpilot.git e676f501b2ba6d7b2046a32f779af3410471bae9
          git fetch --no-tags https://github.com/TonyBinheWu/sunnypilot.git 56d1fed389f23af7db55d33e48165764f84c4904
          git bundle verify reviewed-mobile.bundle
          git fetch reviewed-mobile.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "0c99b78152db11d18c4b6adbc9ef6295675fbe8b"
          test "$(git rev-parse FETCH_HEAD^1^1)" = "7d88a71eb9d1c3aecd30d0b84b8692e86c07f235"
          test "$(git rev-parse FETCH_HEAD^2)" = "e676f501b2ba6d7b2046a32f779af3410471bae9"
          test "$(git rev-parse FETCH_HEAD^1^2)" = "56d1fed389f23af7db55d33e48165764f84c4904"
          git push origin 0c99b78152db11d18c4b6adbc9ef6295675fbe8b:refs/heads/review/formosa-phone-radar-candidate-20261118
  android:
    needs: prepare
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0c99b78152db11d18c4b6adbc9ef6295675fbe8b
          sparse-checkout: tools/carrot_android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and build cockpit with temporary debug signing
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          & "$sdk/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-36' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/carrot_android/build.ps1 -Cockpit -Sdk $sdk -Jdk $env:JAVA_HOME -OutputApk "$env:RUNNER_TEMP/cockpit.apk" -DebugKeystore "$env:RUNNER_TEMP/debug.jks"
