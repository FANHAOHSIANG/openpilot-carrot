name: Verify reviewed Formosa mobile integration
on:
  push:
    branches: ['review/formosa-phone-check-20261118']
permissions:
  contents: read
jobs:
  android:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0c99b78152db11d18c4b6adbc9ef6295675fbe8b
          sparse-checkout: tools/carrot_android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and build cockpit with temporary debug signing
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          & "$sdk/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-36' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/carrot_android/build.ps1 -Cockpit -Sdk $sdk -Jdk $env:JAVA_HOME -OutputApk "$env:RUNNER_TEMP/cockpit.apk" -DebugKeystore "$env:RUNNER_TEMP/debug.jks"
  radar:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONPATH: .:opendbc_repo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0c99b78152db11d18c4b6adbc9ef6295675fbe8b
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install Cython==3.2.9 setuptools scons pytest -r tools/carrot_route_vault/requirements.txt
      - run: scons -f tools/native_cpu/SConstruct -j2
      - run: python opendbc_repo/opendbc/dbc/generator/generator.py
      - run: python -m pytest -q -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/tests openpilot/selfdrive/carrot/tests/{test_trajectory_cutin,test_radar_compute_reuse,test_trajectory_cutout,test_radar_motion_predictor,test_radar_cutout_fast_path,test_scc_lead_policy,test_radar_forced_scc_gate,test_radard_dpath}.py
