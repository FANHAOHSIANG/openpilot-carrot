name: Isolated 2026-11-24 official and Tony upstream merge
on:
  push:
    branches: ['sync/tony-integrated-upstream-20261124']
    paths:
      - '.github/workflows/review-upstream-merge-20261124.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  isolated-review-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch pinned official and Tony commits and safely three-way merge
        shell: bash
        env:
          BRANCH: sync/tony-integrated-upstream-20261124
          FUSION_BASE: 7ab0a6e0c9081cc4fae9c06cae032f20943fa7be
          OFFICIAL_SHA: 6a9225b541f4777b7202ec49abd8b80d7a78b9ba
          TONY_SHA: f85177629d521147c8a29f206e09f48b4e9d020f
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          git config user.name "Carrot upstream review"
          git config user.email "carrot-upstream-review@users.noreply.github.com"
          git merge-base --is-ancestor "$FUSION_BASE" HEAD || {
            echo "Unexpected fusion base; refusing merge"; exit 1;
          }
          git remote add carrot-official https://github.com/ajouatom/openpilot.git
          git remote add tony-original https://github.com/TonyBinheWu/sunnypilot.git
          git fetch --no-tags carrot-official carrot-wip
          git fetch --no-tags tony-original carrot-wip
          git cat-file -e "$OFFICIAL_SHA^{commit}"
          git cat-file -e "$TONY_SHA^{commit}"
          git merge-base --is-ancestor "$OFFICIAL_SHA" FETCH_HEAD || true
          echo "Fusion base $FUSION_BASE"
          echo "Official pinned $OFFICIAL_SHA"
          echo "Tony pinned $TONY_SHA"
          echo "Current HEAD $(git rev-parse HEAD)"

          if ! git merge --no-ff --no-commit "$OFFICIAL_SHA"; then
            echo "Inspecting official merge conflicts."
            conflicted=$(git diff --name-only --diff-filter=U)
            if [ "$conflicted" != "AGENTS.md" ]; then
              echo "::error::Official source conflict beyond AGENTS.md; refusing auto-resolution."
              git status --short
              printf '%s\\n' "$conflicted"
              exit 10
            fi
            # AGENTS.md is documentation only. Preserve fusion's historical
            # safety/research notes and prepend the official PV5 safety memo.
            git show :2:AGENTS.md > /tmp/fusion-AGENTS.md
            git show :3:AGENTS.md > /tmp/official-AGENTS.md
            python3 - <<'PY'
          from pathlib import Path
          ours = Path("/tmp/fusion-AGENTS.md").read_text(encoding="utf-8")
          theirs = Path("/tmp/official-AGENTS.md").read_text(encoding="utf-8")
          prefix = "# Repository memory\n\n"
          assert ours.startswith(prefix) and theirs.startswith(prefix)
          assert theirs[len(prefix):].startswith("- 2026-11-23: Preserve fresh original camera 0x161")
          memo = theirs[len(prefix):].split("\n\n", 1)[0].rstrip("\n")
          assert "No live vehicle writes or physical display validation." in memo
          assert "No lane-control/paint-color inference" in memo
          merged = ours if memo in ours else prefix + memo + "\n\n" + ours[len(prefix):]
          Path("AGENTS.md").write_text(merged, encoding="utf-8")
          PY
            git add AGENTS.md
            test -z "$(git diff --name-only --diff-filter=U)"
            echo "AGENTS.md resolved by preserving fusion notes plus official PV5 memo."
          fi
          git diff --check || { echo "::error::Whitespace/patch errors in official merge"; exit 11; }
          git commit -m "Merge official carrot-wip 6a9225b5 into isolated fusion review"
          echo "Official merge complete"

          if ! git merge --no-ff --no-commit "$TONY_SHA"; then
            echo "::error::Tony -> fusion conflict; manual hunk review required."
            git status --short
            git diff --name-only --diff-filter=U
            git diff --stat
            python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=U"], text=True).splitlines()
          print(f"=== CONFLICT FILES: {len(files)} ===", flush=True)
          for file in files:
              print(f"\\n=== {file} ===", flush=True)
              lines = Path(file).read_text(encoding="utf-8").splitlines()
              indexes = [i for i, line in enumerate(lines) if line.startswith("<<<<<<<")]
              print(f"Conflict hunks: {len(indexes)}", flush=True)
              for hi, start in enumerate(indexes[:12], 1):
                  end = next((i for i in range(start + 1, len(lines))
                              if lines[i].startswith(">>>>>>>")), min(start+90, len(lines)-1))
                  lo = max(0, start-4); top = min(len(lines), end+5)
                  text = "\\n".join(f"{i+1}: {lines[i]}" for i in range(lo, top))
                  print(f"-- hunk {hi} (line {start+1}) --\\n{text[:6000]}", flush=True)
          PY
            exit 20
          fi
          git diff --check || { echo "::error::Whitespace/patch errors in Tony merge"; exit 21; }
          git commit -m "Merge Tony carrot-wip f8517762 into isolated fusion review"

          git merge-base --is-ancestor "$OFFICIAL_SHA" HEAD
          git merge-base --is-ancestor "$TONY_SHA" HEAD
          git merge-base --is-ancestor "$FUSION_BASE" HEAD
          test -z "$(git status --porcelain)"
          echo "Review candidate $(git rev-parse HEAD)"
          echo "Changed file summary relative to existing fusion:"
          git diff --stat "$FUSION_BASE"..HEAD
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Both upstream commits merged on the isolated review branch only."
