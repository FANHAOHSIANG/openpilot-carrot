name: Import reviewed qualification update
on:
  push:
    branches: ['review/import-tony-0019-20261119']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed merge and retain it for CI
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/TonyBinheWu/sunnypilot.git 306d4f8958b4570da96ae0cff019da64577a0c4e
          git bundle verify reviewed.bundle
          git fetch reviewed.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = 76bb73092c03543b2f27e2fae0c80d0f438adf50
          test "$(git show -s --format=%P FETCH_HEAD)" = "4cb140f14562c3715fc63eb5f4b1c323581746ae 306d4f8958b4570da96ae0cff019da64577a0c4e"
          git push origin 76bb73092c03543b2f27e2fae0c80d0f438adf50:refs/heads/review/tony-0019-qualification-20261119
