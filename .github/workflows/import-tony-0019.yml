name: Import reviewed Tony follow-up
on:
  push:
    branches: ['review/import-tony-0019-20261119']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed training-only follow-up
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/TonyBinheWu/sunnypilot.git 5b5fd52655787b2b106224a6b5abe5c623d15570
          git bundle verify reviewed.bundle
          git fetch reviewed.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = 8bb6ff672643ce5e76d0b24b23a593c5f728ad0d
          test "$(git show -s --format=%P FETCH_HEAD)" = "f0e3595620d68e8feab61cce9e33ee08991d98d3 5b5fd52655787b2b106224a6b5abe5c623d15570"
          git push origin 8bb6ff672643ce5e76d0b24b23a593c5f728ad0d:refs/heads/review/tony-0019-final-20261119
