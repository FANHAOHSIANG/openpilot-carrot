name: Carrot official radar and source-preservation gate
on:
  pull_request:
    branches:
      - test/carrot-wip-upstream-20261104
    paths:
      - 'openpilot/selfdrive/carrot/radar_motion/**'
      - 'openpilot/selfdrive/carrot/tests/test_radar_motion_predictor.py'
      - '.github/workflows/carrot-official-radar-sync-gate.yml'
permissions:
  contents: read
jobs:
  preserve-tested-source:
    name: Preserve pinned official, Test and LED source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merged history and unchanged test-source modules
        shell: bash
        run: |
          set -euo pipefail
          # Compare to the actual PR Test base, not an obsolete static snapshot.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "No PR base available for Test source preservation"
            exit 1
          fi
          test_base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$test_base" ]; then
            echo "Missing pinned Test base"
            exit 1
          fi
          git merge-base --is-ancestor "$test_base" HEAD
          git merge-base --is-ancestor a9811adce075a81f6a719e611f28ae444193f750 HEAD
          for path in tools/iphone_led openpilot/selfdrive/carrot/iphone_led_bridge.py openpilot/cereal/custom.capnp openpilot/system/manager/process_config.py; do
            expected="$(git rev-parse "$test_base:$path")"
            actual="$(git rev-parse "HEAD:$path")"
            if [ "$expected" != "$actual" ]; then
              echo "Unexpected change from current Test base in custom content: $path"
              exit 1
            fi
          done
  radar-regression:
    name: Radar motion persistent-match regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .:opendbc_repo
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test-only dependencies
        run: python -m pip install pytest==8.3.5 numpy pycapnp
      - name: Compile updated radar Python modules
        run: python -m compileall -q openpilot/selfdrive/carrot/radar_motion
      - name: Run full radar motion predictor regression test
        run: python -m pytest -q -o addopts='' -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/tests openpilot/selfdrive/carrot/tests/test_radar_motion_predictor.py
      - name: Run upstream radar reuse and cut-in regression tests
        run: >-
          python -m pytest -q -o addopts='' -c /dev/null --rootdir=. --confcutdir=openpilot/selfdrive/carrot/tests
          openpilot/selfdrive/carrot/tests/test_radar_compute_reuse.py
          openpilot/selfdrive/carrot/tests/test_trajectory_cutin.py
  onnx-history-gather:
    name: ONNX history Gather native CPU compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: tinygrad_repo:.
      DEV: CPU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model test dependencies
        run: python -m pip install numpy pytest requests psutil scons cython setuptools aiohttp
      - name: Verify model Gather history and JIT inputs
        run: python -m pytest -c /dev/null --noconftest -q openpilot/selfdrive/modeld/tests/test_onnx_history_gather.py
