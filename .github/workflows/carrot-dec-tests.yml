name: Carrot DEC and parked-switch focused tests
on:
  push:
    branches: [carrotpilot-dec]
  pull_request:
    paths:
      - 'openpilot/selfdrive/controls/lib/carrot_dec.py'
      - 'openpilot/selfdrive/controls/lib/longitudinal_planner.py'
      - 'openpilot/selfdrive/controls/tests/test_carrot_dec.py'
      - 'openpilot/selfdrive/carrot_settings.json'
      - 'openpilot/common/params_keys.h'
      - 'openpilot/selfdrive/modeld/jetlink/**'
      - 'openpilot/selfdrive/modeld/tests/test_parked_switch*.py'
      - 'openpilot/tools/jetlink/configure_parked_switch.py'
      - '.github/workflows/carrot-dec-tests.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: DEC unit and planner-block integration tests
        run: python openpilot/selfdrive/controls/tests/test_carrot_dec.py
      - name: Planner syntax
        run: python -m py_compile openpilot/selfdrive/controls/lib/carrot_dec.py openpilot/selfdrive/controls/lib/longitudinal_planner.py
      - name: Parked model handoff and approval tests
        run: python openpilot/selfdrive/modeld/tests/test_parked_switch.py
      - name: Offroad opt-in configuration tests
        run: python openpilot/selfdrive/modeld/tests/test_parked_switch_config.py
      - name: Parked-switch syntax
        run: python -m py_compile openpilot/selfdrive/modeld/jetlink/daemon.py openpilot/selfdrive/modeld/jetlink/mac.py openpilot/selfdrive/modeld/jetlink/model.py openpilot/selfdrive/modeld/jetlink/parked.py openpilot/tools/jetlink/configure_parked_switch.py
