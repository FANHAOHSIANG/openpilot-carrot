name: Park-only offroad checks
on:
  pull_request:
    branches: [test/carrot-wip-upstream-20261104]
    paths:
      - 'openpilot/common/**'
      - 'openpilot/selfdrive/car/card.py'
      - 'openpilot/selfdrive/carrot/**'
      - 'openpilot/selfdrive/ui/**'
      - 'openpilot/system/hardware/hardwared.py'
      - 'openpilot/system/manager/**'
      - '.github/workflows/park-only-offroad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parked-interlock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 aiohttp
      - name: Syntax and isolated parked lifecycle tests
        env:
          PYTHONPATH: .:opendbc_repo
        run: |
          python -m py_compile openpilot/common/forced_offroad.py openpilot/selfdrive/car/card.py openpilot/system/hardware/hardwared.py openpilot/system/manager/manager.py openpilot/system/manager/process_config.py openpilot/selfdrive/ui/widgets/forced_offroad.py openpilot/selfdrive/ui/layouts/settings/device.py openpilot/selfdrive/ui/mici/layouts/settings/device.py openpilot/selfdrive/carrot/server/features/forced_offroad.py
          python -m pytest --noconftest -o addopts= -q openpilot/common/tests/test_forced_offroad.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web switch failure and race tests
        working-directory: openpilot/selfdrive/carrot/web
        run: node --test tests/forced_offroad.test.mjs
