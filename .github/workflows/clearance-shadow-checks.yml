name: Clearance shadow checks
on:
  pull_request:
    paths:
      - 'openpilot/tools/clearance_shadow/**'
      - 'openpilot/system/manager/process_config.py'
      - '.github/workflows/clearance-shadow-checks.yml'
  push:
    branches:
      - 'experiment/clearance-shadow-*'
      - 'test/truck-clearance-shadow-*'
    paths:
      - 'openpilot/tools/clearance_shadow/**'
      - 'openpilot/system/manager/process_config.py'
      - '.github/workflows/clearance-shadow-checks.yml'
permissions:
  contents: read
jobs:
  policy-and-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            openpilot/tools/clearance_shadow
            openpilot/system/manager/process_config.py
            pyproject.toml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow pytest ruff opencv-python-headless==4.13.0.92
      - run: python -m ruff check openpilot/tools/clearance_shadow
      - run: python -m pytest --confcutdir=openpilot/tools/clearance_shadow/tests -c openpilot/tools/clearance_shadow/pytest.ini openpilot/tools/clearance_shadow/tests
