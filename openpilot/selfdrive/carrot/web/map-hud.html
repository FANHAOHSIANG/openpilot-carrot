<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrot Map HUD</title><style>
*{box-sizing:border-box}body{margin:0;background:#111a20;color:#eef4f6;font:17px system-ui;padding:24px}main{max-width:650px;margin:auto}a{color:#8bd6ee}h1{font-size:30px}section{background:#202f39;padding:22px;border-radius:18px;margin:18px 0}label{display:block;margin:18px 0 8px}input[type=url],select{width:100%;padding:13px;border:1px solid #64808e;background:#111a20;color:white;border-radius:9px;font:inherit}button{padding:13px 24px;border:0;border-radius:9px;background:#ff9e4a;font:inherit;margin-top:20px}p{line-height:1.6;color:#c8d8df}output{display:block;white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}.note{font-size:15px}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}
</style><main><a href="/?page=tools" id="back">返回 Carrot Web</a><h1>Carrot Map HUD</h1><p id="intro">將 CP 搭子的高德投屏送到外接 HUD。箭頭、路名與距離沿用 Navi v2。</p>
<section><form id="form"><label><input type="checkbox" id="enabled"> <span id="enableLabel">啟用地圖轉送</span></label>
<label for="url" id="urlLabel">CP 搭子投屏網址</label><input id="url" type="url" placeholder="http://192.168.x.x:port" autocomplete="off">
<p class="note" id="help">先在 CP 搭子開啟高德投屏，填它顯示的網址（含連接埠）。支援首頁網址或 /frame。手機與 C4 必須在同一網路，且 CP 搭子的 Navi v2 已連到 C4。</p>
<label for="fps" id="fpsLabel">地圖更新頻率</label><select id="fps"><option value="1">1 FPS</option><option value="2" selected>2 FPS</option><option value="3">3 FPS</option><option value="4">4 FPS</option><option value="5">5 FPS</option></select>
<p class="note" id="budget">建議先用 2 FPS。畫面最多 800 × 480；取圖失敗或停止更新時會移除舊地圖。韓國 App 的原生地圖串流優先。</p><button id="save">儲存</button></form></section>
<section><h2 id="statusTitle">轉送狀態</h2><output id="status">讀取中…</output></section>
<p class="note" id="limits">這是現有投屏的轉送，不會產生缺少的路線座標或獨立 3D 路口圖片。需正常啟用 App 的投屏功能。</p></main>
<script>
const dict={en:{back:'Back to Carrot Web',intro:'Send CPdazi Amap projection to the external HUD. Navi v2 supplies turn instructions.',enableLabel:'Enable map relay',urlLabel:'CPdazi projection URL',help:'Start projection in CPdazi and enter its displayed URL including the port. Use the base URL or /frame. Both devices must share a LAN and CPdazi Navi v2 must connect to this comma.',fpsLabel:'Map refresh rate',budget:'Start at 2 FPS. Maximum 800 × 480. Stale maps are cleared; the native Korean map stream takes priority.',save:'Save',statusTitle:'Relay status',limits:'Relays existing projection only. It does not create missing route coordinates or separate 3D junction images. Normal app projection activation is required.'},ko:{back:'Carrot Web으로',intro:'CPdazi 고덕 지도 투사 화면을 외부 HUD로 전송합니다. 회전 안내는 Navi v2를 사용합니다.',enableLabel:'지도 전송 사용',urlLabel:'CPdazi 투사 URL',help:'CPdazi 투사를 시작하고 표시된 URL과 포트를 입력하세요. 기본 URL 또는 /frame을 사용합니다. 동일 LAN과 comma의 Navi v2 연결이 필요합니다.',fpsLabel:'지도 갱신 속도',budget:'2 FPS부터 시작하세요. 최대 800 × 480. 오래된 지도는 제거하며 한국 앱의 기본 지도 스트림이 우선합니다.',save:'저장',statusTitle:'전송 상태',limits:'기존 투사 화면만 전달합니다. 없는 경로 좌표나 별도 3D 교차로 이미지를 만들지 않습니다. 앱의 정상 투사 활성화가 필요합니다.'}};
const language=new URLSearchParams(location.search).get('lang')||navigator.language;const t=dict[language.startsWith('ko')?'ko':language.startsWith('en')?'en':'zh']||{};for(const [id,v]of Object.entries(t))document.getElementById(id).textContent=v;
const labels={disabled:'已關閉 / Disabled',waiting_navigation:'等待 Navi v2 連線 / Waiting for Navi v2',streaming:'地圖轉送中 / Streaming',stalled:'來源畫面停止更新 / Projection stalled',source_error:'無法取得畫面 / Source error',native_map_or_session_changed:'原生地圖優先或連線已切換 / Native map or session changed',not_running:'接收程序未啟動 / Receiver not running'};
let saving=false;async function refresh(initial=false){try{const r=await fetch('/api/map_hud',{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();if(initial){enabled.checked=d.config.enabled;url.value=d.config.frame_url;fps.value=d.config.fps}const s=d.status;status.textContent=[labels[s.state]||s.state,s.worker_alive===false?'程序未回報狀態 / Worker not reporting':'',s.detail||'',s.frames!==undefined?'Frames: '+s.frames:'',s.width?`${s.width} × ${s.height} · ${s.bytes} bytes`:''].filter(Boolean).join('\n')}catch(e){status.textContent=String(e)}}
const enabled=document.getElementById('enabled'),url=document.getElementById('url'),fps=document.getElementById('fps'),status=document.getElementById('status');document.getElementById('form').onsubmit=async e=>{e.preventDefault();saving=true;try{const r=await fetch('/api/map_hud',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:enabled.checked,frame_url:url.value,fps:Number(fps.value)})});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);url.value=d.config.frame_url;await refresh()}catch(e){status.textContent=String(e)}finally{saving=false}};refresh(true);setInterval(()=>{if(!document.hidden&&!saving)refresh()},2000);
</script></html>
